<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初心者のためのAI勉強会｜社内勉強会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --primary: #1c6cf3;
      --accent: #fbbf24;
      --bg: #f4f7fb;
      --text: #1a2132;
      --muted: #5b6b8d;
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Noto Sans JP', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      width: min(960px, 100%);
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 32px 60px -40px rgba(28, 108, 243, 0.5), 0 24px 32px -24px rgba(26, 33, 50, 0.22);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .hero {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: radial-gradient(circle at top right, rgba(28, 108, 243, 0.45), transparent 45%),
                  linear-gradient(135deg, rgba(27, 172, 224, 0.65), rgba(28, 108, 243, 0.8));
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      mix-blend-mode: multiply;
      filter: saturate(120%) brightness(105%);
      opacity: 0.92;
    }

    .hero::after {
      content: "AI STUDY";
      position: absolute;
      left: 48px;
      bottom: 32px;
      font-size: clamp(1.75rem, 2.2vw + 1rem, 3rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
    }

    .content {
      padding: clamp(24px, 5vw, 48px);
      display: grid;
      gap: clamp(24px, 4vw, 40px);
    }

    .content header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .content h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2.2vw + 1rem, 2.75rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .content p {
      margin: 0;
      font-size: clamp(1rem, 0.6vw + 0.95rem, 1.2rem);
      color: var(--muted);
      max-width: 520px;
    }

    .details {
      display: grid;
      gap: 20px;
    }

    .detail-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px 20px;
      align-items: center;
      padding: 18px 22px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(28, 108, 243, 0.08), rgba(251, 191, 36, 0.08));
      border: 1px solid rgba(28, 108, 243, 0.14);
    }

    .detail-item svg {
      width: 36px;
      height: 36px;
      color: var(--primary);
      background: rgba(28, 108, 243, 0.12);
      border-radius: 12px;
      padding: 8px;
    }

    .detail-item h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--primary);
    }

    .detail-item span {
      grid-column: 2 / -1;
      font-size: clamp(1.1rem, 0.9vw + 1rem, 1.4rem);
      font-weight: 600;
      color: var(--text);
    }

    @media (max-width: 720px) {
      body {
        padding: 24px 12px;
      }

      .card {
        border-radius: 24px;
      }

      .hero::after {
        left: 24px;
        bottom: 24px;
      }

      .detail-item {
        grid-template-columns: 48px 1fr;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <article class="card">
    <figure class="hero">
      <img src="https://images.unsplash.com/photo-1526378722484-bd91ca387e72?auto=format&fit=crop&w=1600&q=80" alt="AI 勉強会のイメージ" />
    </figure>
    <section class="content">
      <header>
        <h1>初心者のためのAI勉強会</h1>
        <p>「AIはなんとなく使っているけど、どんなことができるのかわからない。」「ChatGPTしか使ったことがなく、他のAIにも詳しくなりたい。」そんな方のために勉強会を開きます！AIの基礎知識から実際の使い方まで幅広く学びましょう！</p>
      </header>
      <div class="details">
        <div class="detail-item">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75A2.25 2.25 0 0 0 14.25 4.5h-4.5A2.25 2.25 0 0 0 7.5 6.75V10.5m9 0H7.5m9 0 1.5.75a2.25 2.25 0 0 1 1.5 2.107V18a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 18v-4.643a2.25 2.25 0 0 1 1.5-2.107L7.5 10.5m9 0V9a1.5 1.5 0 0 0-1.5-1.5h-6A1.5 1.5 0 0 0 7.5 9v1.5" />
          </svg>
          <h2>タイトル</h2>
          <span>初心者のためのAI勉強会</span>
        </div>
        <div class="detail-item">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008Zm0 3h.008v.008H12V15Zm0 3h.008v.008H12V18Z" />
          </svg>
          <h2>開催日時</h2>
          <span>2025年11月1日 10:00〜12:00</span>
        </div>
        <div class="detail-item">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0h6" />
          </svg>
          <h2>場所</h2>
          <span>会議室A</span>
        </div>
      </div>
    </section>
  </article>
</body>
</html>
